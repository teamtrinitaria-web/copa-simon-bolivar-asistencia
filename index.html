
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistencia | Copa Simón Bolívar 2026</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #09182b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .contenedor {
      max-width: 480px;
      margin: 30px auto;
      padding: 24px;
      background: #132943;
      border: 1px solid #c9a44c;
      border-radius: 16px;
    }

    h1 { color: #e0bd68; }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid #c9a44c;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      background: #c9a44c;
      color: #09182b;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #lectorQR {
      width: 100%;
      margin-top: 20px;
    }

    #estado {
      margin-top: 20px;
      line-height: 1.5;
    }

    .oculto { display: none; }

    .resultado {
      margin-top: 18px;
      padding: 15px;
      border: 1px solid #c9a44c;
      border-radius: 10px;
      line-height: 1.6;
    }

    .separador {
      border: 0;
      border-top: 1px solid #38516c;
      margin: 22px 0;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>COPA SIMÓN BOLÍVAR 2026</h1>
  <p>CONTROL DE ASISTENCIA</p>

  


  <section id="personalVerificado" class="oculto">
    <p>Personal autorizado:</p>
    <strong id="nombrePersonal"></strong>
  </section>

  <section id="seccionEscaner" class="oculto">
    <hr class="separador">

    <h3>Escáner de jugadores</h3>

    <div id="lectorQR"></div>

    <button id="activar" onclick="activarEscaner()">
      ACTIVAR ESCÁNER
    </button>

    <div id="estado">Escáner preparado.</div>

    <div id="resultado" class="resultado oculto"></div>
  </section>

  <p id="mensaje" aria-live="polite"></p>

</div>

<iframe
  id="puente"
  src="https://script.google.com/macros/s/AKfycbyIWGTH89PLTE4LYghDmLoy2Yumz8XFtPlOypfqTn0JOWU3z6b7NUH5hdi23St9rvsg/exec?puente=1"
  style="display:none"
onload="mostrarMensaje('El iframe de Google Apps Script ha cargado.');"
></iframe>

<script>
  let tokenSesion = "";
  let correoVerificado = "";
  let lectorQR = null;
  let procesandoQR = false;
  let operacionPendiente = "";

  const puente = document.getElementById("puente");

  let ventanaPuente = null;
let origenPuente = "";
  
  function mostrarMensaje(texto) {
    document.getElementById("mensaje").textContent = texto || "";
  }

  function enviarAlPuente(tipo, datos) {
    if (!puente.contentWindow) {
      mostrarMensaje("No se pudo establecer la conexión.");
      return;
    }

    puente.contentWindow.postMessage(
      { tipo: tipo, ...datos },
      "*"
    );
  }

  window.addEventListener("message", function(event) {
if (event.origin !== "https://script.google.com" &&
    !event.origin.endsWith(".googleusercontent.com")) return;
    const datos = event.data || {};

    if (datos.tipo === "PUENTE_LISTO") {
      mostrarMensaje("Conexión con Google Apps Script establecida.");
      return;
    }
    
    const respuesta = datos.respuesta || {};

if (datos.tipo === "CLAVE_VERIFICADA") {
  const boton = document.getElementById("btnClave");

  boton.disabled = false;
  boton.textContent = "INGRESAR AL ESCÁNER";

  operacionPendiente = "";

  const respuesta = datos.respuesta || {};

  if (!respuesta.ok) {
    mostrarMensaje("No se pudo verificar la clave.");
    return;
  }

  tokenSesion = document.getElementById("clave").value;
document.getElementById("clave").value = "";

  document.getElementById("acceso")
    .classList.add("oculto");

  document.getElementById("personalVerificado")
    .classList.remove("oculto");

  document.getElementById("seccionEscaner")
    .classList.remove("oculto");

  document.getElementById("nombrePersonal")
    .textContent = respuesta.correo;

  mostrarMensaje("Acceso autorizado. Escáner preparado.");
}
    
    if (datos.tipo === "CODIGO_SOLICITADO") {
      const boton = document.getElementById("btnEnviar");
      boton.disabled = false;
      boton.textContent = "ENVIAR CÓDIGO";
      operacionPendiente = "";

      mostrarMensaje(respuesta.mensaje);

      if (respuesta.ok) {
        document.getElementById("seccionCodigo")
          .classList.remove("oculto");
      }
    }

    if (datos.tipo === "CODIGO_VERIFICADO") {
      const boton = document.getElementById("btnVerificar");
      boton.disabled = false;
      boton.textContent = "VERIFICAR ACCESO";
      operacionPendiente = "";

      if (!respuesta.ok) {
        mostrarMensaje(respuesta.mensaje);
        return;
      }

      tokenSesion = respuesta.token;
      correoVerificado = respuesta.correo;

      document.getElementById("acceso")
        .classList.add("oculto");

      document.getElementById("personalVerificado")
        .classList.remove("oculto");

      document.getElementById("seccionEscaner")
        .classList.remove("oculto");

      document.getElementById("nombrePersonal")
        .textContent = correoVerificado;

      mostrarMensaje("Acceso autorizado. Escáner preparado.");
    }

    if (datos.tipo === "ASISTENCIA_REGISTRADA") {
      operacionPendiente = "";
      procesandoQR = false;

      mostrarResultado(respuesta);
    }

    if (datos.tipo === "ERROR") {
  operacionPendiente = "";
  procesandoQR = false;

  const botonClave = document.getElementById("btnClave");

  if (botonClave) {
    botonClave.disabled = false;
    botonClave.textContent = "INGRESAR AL ESCÁNER";
  }

  mostrarMensaje(
    datos.respuesta && datos.respuesta.mensaje
      ? datos.respuesta.mensaje
      : "No se pudo completar la operación. Inténtalo nuevamente."
  );
}
  });

  puente.addEventListener("load", function() {
    puente.contentWindow.postMessage(
      { tipo: "COMPROBAR_PUENTE" },
      "*"
    );
  });

  function verificarClave() {
  if (operacionPendiente) return;

  const clave = document.getElementById("clave").value.trim();

  if (!clave) {
    mostrarMensaje("Introduce tu clave privada.");
    return;
  }

  const boton = document.getElementById("btnClave");

  boton.disabled = true;
  boton.textContent = "VERIFICANDO...";

  mostrarMensaje("Comprobando clave...");

  operacionPendiente = "VALIDAR_CLAVE";

  enviarAlPuente("VALIDAR_CLAVE", {
    clave: clave
  });
}
  function solicitarCodigo() {
    if (operacionPendiente) return;

    const correo = document.getElementById("correo")
      .value.trim().toLowerCase();

    if (!correo) {
      mostrarMensaje("Introduce tu correo electrónico.");
      return;
    }

    const boton = document.getElementById("btnEnviar");

    boton.disabled = true;
    boton.textContent = "ENVIANDO...";
    mostrarMensaje("Solicitando código de acceso...");

    operacionPendiente = "SOLICITAR_CODIGO";

    enviarAlPuente("SOLICITAR_CODIGO", {
      correo: correo
    });
  }

  function verificarCodigo() {
    if (operacionPendiente) return;

    const correo = document.getElementById("correo")
      .value.trim().toLowerCase();

    const codigo = document.getElementById("codigo")
      .value.trim();

    if (!/^\d{6}$/.test(codigo)) {
      mostrarMensaje("Introduce el código de 6 dígitos.");
      return;
    }

    const boton = document.getElementById("btnVerificar");

    boton.disabled = true;
    boton.textContent = "VERIFICANDO...";
    mostrarMensaje("Verificando acceso...");

    operacionPendiente = "VERIFICAR_CODIGO";

    enviarAlPuente("VERIFICAR_CODIGO", {
      correo: correo,
      codigo: codigo
    });
  }

  async function activarEscaner() {
    const estado = document.getElementById("estado");
    const boton = document.getElementById("activar");

    if (!tokenSesion) {
      estado.textContent = "Primero debes iniciar sesión.";
      return;
    }

    if (lectorQR) return;

    try {
      boton.disabled = true;
      estado.textContent = "Solicitando acceso a la cámara...";

      lectorQR = new Html5Qrcode("lectorQR");

      await lectorQR.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: { width: 220, height: 220 }
        },
        function(textoQR) {
          registrarAsistencia(textoQR);
        }
      );

      estado.textContent = "Cámara activa. Escanea un código QR.";
    } catch (error) {
      estado.textContent = "Error de cámara: " + error;
      lectorQR = null;
      boton.disabled = false;
    }
  }

  function registrarAsistencia(idQR) {
    if (procesandoQR || !tokenSesion) return;

    procesandoQR = true;

    document.getElementById("estado").textContent =
      "QR detectado. Validando asistencia...";

    document.getElementById("resultado")
      .classList.add("oculto");

    operacionPendiente = "REGISTRAR_ASISTENCIA";

    enviarAlPuente("REGISTRAR_ASISTENCIA_CLAVE", {
  clave: tokenSesion,
  idQR: idQR
});

  function mostrarResultado(respuesta) {
    const resultado = document.getElementById("resultado");

    resultado.replaceChildren();

    const titulo = document.createElement("strong");
    titulo.textContent = respuesta.ok
      ? "ASISTENCIA REGISTRADA"
      : "AVISO";

    const mensaje = document.createElement("p");
    mensaje.textContent = respuesta.mensaje || "";

    resultado.append(titulo, mensaje);

    if (respuesta.nombre) {
      const nombre = document.createElement("p");
      nombre.textContent = "Jugador: " + respuesta.nombre;
      resultado.appendChild(nombre);
    }

    if (respuesta.equipo) {
      const equipo = document.createElement("p");
      equipo.textContent = "Equipo: " + respuesta.equipo;
      resultado.appendChild(equipo);
    }

    resultado.classList.remove("oculto");

    document.getElementById("estado").textContent =
      "Listo para el siguiente jugador.";

    mostrarMensaje("");

    setTimeout(function() {
      procesandoQR = false;
    }, 1800);
  }
</script>

</body>
</html>
